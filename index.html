<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Game Launcher</title>
        <style>
            body {
                background: #121212;
                color: #e0e0e0;
                font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
                margin: 0;
                overflow: hidden;
            }

            .container {
                width: 350px;
                text-align: left;
            }

            #status {
                font-size: 14px;
                font-weight: 500;
                margin-bottom: 10px;
                color: #fff;
            }

            #progress-wrapper {
                width: 100%;
                height: 8px;
                background: #333;
                border-radius: 4px;
                overflow: hidden;
            }

            #fill {
                background: #2196F3;
                height: 100%;
                width: 0%;
                transition: width .3s ease;
            }

            #details {
                margin-top: 10px;
                display: flex;
                justify-content: space-between;
                font-size: 11px;
                color: #888;
                text-transform: uppercase;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div id="status">Preparing...</div>
            <div id="progress-wrapper">
                <div id="fill"></div>
            </div>
            <div id="details">
                <span id="byte-count">0 MB / 0 MB</span>
                <span id="eta">Estimating...</span>
            </div>
        </div>
        <script>
            const TOTAL_CHUNKS = 34;
            // Parts live next to this page; relative so root and subpath deploys both work.
            const BASE_NAME = "o.zip.part";
            const IDB_NAME = "omori-vfs";
            const VERIFY = {
                // Every file in the archive is CRC-checked by the worker (cheap:
                // compressed bytes only). On top of that we GET-probe a sample
                // through the real /virtual/ serve path to prove the serving
                // pipeline works for every asset type.
                GET_PROBE: 40
            };

            const el = (id) => document.getElementById(id);
            const setStatus = (t) => { el("status").innerText = t; };
            const setProgress = (pct) => { el("fill").style.width = Math.max(0, Math.min(100, pct)) + "%"; };
            const setBytes = (t) => { el("byte-count").innerText = t; };
            const setEta = (t) => { el("eta").innerText = t; };

            function fail(message, details) {
                console.error(message, details || "");
                setStatus("Error: " + message);
                el("status").style.color = "#ff5252";
                setEta("Failed");
                if (details && details.length) console.table ? console.table(details.slice(0, 30)) : null;
            }

            /* ---- IndexedDB helpers (shared DB name with sw.js) ---- */
            function idbOpen() {
                return new Promise((resolve, reject) => {
                    const open = indexedDB.open(IDB_NAME, 1);
                    open.onupgradeneeded = () => open.result.createObjectStore("kv");
                    open.onerror = () => reject(open.error);
                    open.onsuccess = () => resolve(open.result);
                });
            }
            async function idbPut(key, value) {
                const db = await idbOpen();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction("kv", "readwrite");
                    tx.objectStore("kv").put(value, key);
                    tx.oncomplete = () => resolve();
                    tx.onerror = () => reject(tx.error);
                    tx.onabort = () => reject(tx.error);
                });
            }
            async function idbGet(key) {
                const db = await idbOpen();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction("kv", "readonly");
                    const req = tx.objectStore("kv").get(key);
                    req.onsuccess = () => resolve(req.result || null);
                    req.onerror = () => reject(req.error);
                });
            }

            /* ---- SW plumbing ---- */
            function swMessage(type, timeoutMs, onProgress) {
                return new Promise((resolve, reject) => {
                    const timer = setTimeout(() => reject(new Error(type + " timed out")), timeoutMs);
                    const onMsg = (event) => {
                        const d = event.data || {};
                        if (d.type === type + "_PROGRESS" && onProgress) { onProgress(d); return; }
                        if (d.type === type + "_DONE") {
                            clearTimeout(timer);
                            navigator.serviceWorker.removeEventListener("message", onMsg);
                            resolve(d);
                        } else if (d.type === "MOUNT_ERROR") {
                            clearTimeout(timer);
                            navigator.serviceWorker.removeEventListener("message", onMsg);
                            reject(new Error(d.error));
                        }
                    };
                    navigator.serviceWorker.addEventListener("message", onMsg);
                    navigator.serviceWorker.controller.postMessage({ type });
                });
            }

            async function getWorker() {
                const reg = await navigator.serviceWorker.register("sw.js");
                await navigator.serviceWorker.ready;
                let worker = navigator.serviceWorker.controller;
                if (!worker) {
                    // Not controlled yet (first visit): reload once so it takes over.
                    sessionStorage.setItem("vfsResume", "1");
                    window.location.reload();
                    return null;
                }
                return worker;
            }

            /* ---- verification ---- */
            async function verifyAll() {
                // 1) Worker-side: CRC every entry's compressed bytes against the
                // central directory. Proves the stored archive is intact.
                setStatus("Verifying archive integrity...");
                const crc = await swMessage("VERIFY_CRC", 10 * 60 * 1000, (p) => {
                    setProgress(20 + (p.done / Math.max(1, p.total)) * 60);
                    setBytes(p.done + " / " + p.total + " files");
                    setEta("CRC check");
                });
                if (crc.bad === -1) throw new Error("CRC verify failed: " + (crc.badList || []).join("; "));
                if (crc.bad > 0) {
                    throw new Error(crc.bad + " corrupt file(s) in archive: " + (crc.badList || []).slice(0, 10).join(", "));
                }

                // 2) Page-side: GET-probe a sample through the real serve path,
                // including every file type the game loads at boot.
                setStatus("Probing " + VERIFY.GET_PROBE + " files through /virtual/...");
                const listMsg = await swMessage("LIST", 60000);
                const files = listMsg.files || [];
                if (!files.length) throw new Error("VFS reports no files");

                const picks = [];
                const byExt = {};
                for (const f of files) {
                    const ext = (f.split(".").pop() || "").toLowerCase();
                    (byExt[ext] = byExt[ext] || []).push(f);
                }
                for (const ext of ["html", "js", "css", "json", "png", "ogg", "mp4", "ttf", "yaml", "txt"]) {
                    const bucket = byExt[ext] || [];
                    if (!bucket.length) continue;
                    const stride = Math.max(1, Math.floor(bucket.length / 4));
                    for (let i = 0; i < bucket.length && picks.length < VERIFY.GET_PROBE; i += stride) {
                        picks.push(bucket[i]);
                    }
                }
                // deterministic top-up if type coverage was thin
                for (let i = 0; i < files.length && picks.length < VERIFY.GET_PROBE; i += Math.ceil(files.length / VERIFY.GET_PROBE)) {
                    picks.push(files[i]);
                }

                const badProbes = [];
                for (const path of picks) {
                    try {
                        const res = await fetch("virtual/" + encodePath(path));
                        if (!res.ok) { badProbes.push(path + " -> HTTP " + res.status); continue; }
                        const buf = await res.arrayBuffer();
                        if (!buf.byteLength) badProbes.push(path + " -> empty body");
                    } catch (e) {
                        badProbes.push(path + " -> " + e.message);
                    }
                }
                setProgress(85);
                if (badProbes.length) {
                    throw new Error(badProbes.length + " probe(s) failed: " + badProbes.slice(0, 10).join(" | "));
                }
                return files.length;
            }

            function encodePath(p) {
                return p.split("/").map(encodeURIComponent).join("/");
            }

            /* ---- main flow ---- */
            async function launch() {
                try {
                    const worker = await getWorker();
                    if (!worker) return; // reloading for control

                    // Fast path: worker already has the zip (rehydration from IDB
                    // makes this survive worker restarts).
                    const pong = await new Promise((resolve) => {
                        const timer = setTimeout(() => resolve(null), 8000);
                        const onMsg = (event) => {
                            const d = event.data || {};
                            if (d.type === "PONG") {
                                clearTimeout(timer);
                                navigator.serviceWorker.removeEventListener("message", onMsg);
                                resolve(d);
                            }
                        };
                        navigator.serviceWorker.addEventListener("message", onMsg);
                        worker.postMessage({ type: "PING" });
                    });

                    if (!pong || !pong.mounted) {
                        // Full path: download all parts, assemble, mount.
                        const zip = await downloadParts();
                        setStatus("Mounting...");
                        await new Promise((resolve, reject) => {
                            const timer = setTimeout(() => reject(new Error("MOUNT timed out")), 120000);
                            const onMsg = (event) => {
                                const d = event.data || {};
                                if (d.type === "MOUNTED") {
                                    clearTimeout(timer);
                                    navigator.serviceWorker.removeEventListener("message", onMsg);
                                    resolve(d);
                                } else if (d.type === "MOUNT_ERROR") {
                                    clearTimeout(timer);
                                    navigator.serviceWorker.removeEventListener("message", onMsg);
                                    reject(new Error(d.error));
                                }
                            };
                            navigator.serviceWorker.addEventListener("message", onMsg);
                            worker.postMessage({ type: "MOUNT", data: zip });
                        });
                    } else {
                        setStatus("Restored archive from cache");
                    }

                    const total = await verifyAll();

                    setStatus("Launching...");
                    setProgress(100);
                    setBytes(total + " files verified");
                    setEta("OK");
                    window.location.href = "virtual/index.html";
                } catch (err) {
                    fail(err.message);
                }
            }

            async function downloadParts() {
                const chunks = [];
                let received = 0;
                const started = Date.now();
                for (let i = 1; i <= TOTAL_CHUNKS; i++) {
                    const name = BASE_NAME + i;
                    setStatus("Downloading " + name + "...");
                    const res = await fetch(name, { mode: "cors" });
                    if (!res.ok) throw new Error("HTTP " + res.status + " fetching " + name);
                    const buf = await res.arrayBuffer();
                    chunks.push(buf);
                    received += buf.byteLength;

                    setProgress((i / TOTAL_CHUNKS) * 18);
                    const speed = received / ((Date.now() - started) / 1000);
                    const expectedTotal = (received / i) * TOTAL_CHUNKS;
                    const remaining = Math.max(0, Math.round((expectedTotal - received) / speed));
                    setBytes((received / 1048576).toFixed(1) + " MB / " + (expectedTotal / 1048576).toFixed(1) + " MB");
                    setEta(i === TOTAL_CHUNKS ? "Complete" : "About " + remaining + "s remaining");
                }
                setStatus("Assembling...");
                const zip = new Blob(chunks, { type: "application/zip" });
                if (zip.size < 22) throw new Error("assembled zip is too small — parts are missing or empty");
                return zip;
            }

            /* ---- entry point ---- */
            window.addEventListener("load", async () => {
                if (!("serviceWorker" in navigator)) { fail("Service workers unsupported"); return; }
                try { await navigator.storage.persist(); } catch (e) {}

                if (sessionStorage.getItem("vfsResume") === "1") {
                    sessionStorage.removeItem("vfsResume");
                    // Reload happened so the worker could take control. Remount from
                    // the persisted copy; if it is missing, fall back to download.
                    try {
                        const stashed = await idbGet("zip");
                        if (!stashed) throw new Error("stashed zip missing");
                        const worker = await (async () => {
                            await navigator.serviceWorker.register("sw.js");
                            await navigator.serviceWorker.ready;
                            let w = navigator.serviceWorker.controller;
                            if (!w) {
                                await new Promise(r => setTimeout(r, 500));
                                w = navigator.serviceWorker.controller;
                            }
                            if (!w) throw new Error("service worker not controlling page");
                            return w;
                        })();
                        const pong = await new Promise((resolve) => {
                            const timer = setTimeout(() => resolve(null), 8000);
                            const onMsg = (event) => {
                                const d = event.data || {};
                                if (d.type === "PONG") {
                                    clearTimeout(timer);
                                    navigator.serviceWorker.removeEventListener("message", onMsg);
                                    resolve(d);
                                }
                            };
                            navigator.serviceWorker.addEventListener("message", onMsg);
                            worker.postMessage({ type: "PING" });
                        });
                        if (!pong || !pong.mounted) {
                            await new Promise((resolve, reject) => {
                                const timer = setTimeout(() => reject(new Error("MOUNT timed out")), 120000);
                                const onMsg = (event) => {
                                    const d = event.data || {};
                                    if (d.type === "MOUNTED") {
                                        clearTimeout(timer);
                                        navigator.serviceWorker.removeEventListener("message", onMsg);
                                        resolve();
                                    } else if (d.type === "MOUNT_ERROR") {
                                        clearTimeout(timer);
                                        navigator.serviceWorker.removeEventListener("message", onMsg);
                                        reject(new Error(d.error));
                                    }
                                };
                                navigator.serviceWorker.addEventListener("message", onMsg);
                                worker.postMessage({ type: "MOUNT", data: stashed });
                            });
                        }
                        const total = await verifyAll();
                        setStatus("Launching...");
                        setProgress(100);
                        setBytes(total + " files verified");
                        setEta("OK");
                        window.location.href = "virtual/index.html";
                    } catch (err) {
                        console.warn("Resume failed: " + err.message + " — falling back to full download");
                        launch();
                    }
                } else {
                    launch();
                }
            });
        </script>
    </body>
</html>
